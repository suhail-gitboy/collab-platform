services:
  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --bind 0.0.0.0 --protected-mode yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_volume_data:/data

  
  redis_insight:
    image: redis/redisinsight:latest   # v2 image (was redislabs/redisinsight:1.14.0)
    container_name: redis_insight
    restart: always
    ports:
      - "127.0.0.1:5540:5540"          # v2 default port
    volumes:
      - redis_insight_volume_data:/data # note: v2 uses /data, not /db

volumes:
  redis_volume_data:
  redis_insight_volume_data:

